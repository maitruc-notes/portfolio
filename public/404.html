<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ebeae4;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      color: #705748;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 12px;
      color: #302925;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #302925;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background-color: #705748;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #8c6045;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>Sorry, the page you are looking for doesn't exist or has been moved. Please check the URL or head back home.</p>
    <a href="/" class="btn" style="">Back to Homepage</a>
  </main>
</body>
</html>
